<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Sales Assistant</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0a0a0a;
  color: white;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 60px 20px;
}

.hero {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

h1 {
  font-size: 56px;
  margin: 0;
}

.gradient {
  color: #8b5cf6;
}

p {
  color: #aaa;
  font-size: 18px;
}

.buttons {
  margin-top: 20px;
}

.btn {
  padding: 14px 24px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  margin-right: 10px;
}

.btn-primary {
  background: linear-gradient(90deg, #7c3aed, #9333ea);
  color: white;
}

.btn-secondary {
  background: transparent;
  border: 1px solid #444;
  color: white;
}

.card {
  background: #111;
  padding: 20px;
  border-radius: 12px;
  width: 350px;
}

.chat {
  position: fixed;
  bottom: 20px;
  right: 20px;
}

.chat-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #8b5cf6;
  border: none;
  font-size: 24px;
  color: white;
  cursor: pointer;
}

.chat-box {
  display: none;
  width: 320px;
  height: 400px;
  background: #111;
  border-radius: 12px;
  margin-bottom: 10px;
  padding: 10px;
}

.chat-box.active {
  display: block;
}

input {
  width: 70%;
  padding: 10px;
  background: #000;
  border: 1px solid #333;
  color: white;
}

button.send {
  padding: 10px;
  background: #8b5cf6;
  border: none;
  color: white;
}
</style>
</head>

<body>

<div class="container">

<div class="hero">
<div>
<h1>Close More Deals <br><span class="gradient">with AI</span></h1>
<p>AI that captures leads, sends payment links and books clients automatically.</p>

<div class="buttons">
<button class="btn btn-primary">Get Started</button>
<button class="btn btn-secondary">Watch Demo</button>
</div>
</div>

<div class="card">
<h3>Live Stats</h3>
<p>Leads: 247</p>
<p>Revenue: $12,450</p>
</div>
</div>

</div>

<div class="chat">
<div class="chat-box" id="chatBox">
<div id="messages"></div>

<input id="input" placeholder="Type..." />
<button class="send" onclick="send()">Send</button>
</div>

<button class="chat-btn" onclick="toggle()">💬</button>
</div>

<script>
const API = "/chat";

function toggle() {
  document.getElementById("chatBox").classList.toggle("active");
}

function add(text, me) {
  const div = document.createElement("div");
  div.innerText = (me ? "You: " : "AI: ") + text;
  document.getElementById("messages").appendChild(div);
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value;

  add(text, true);
  input.value = "";

  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();
  add(data.reply, false);
}
</script>

</body>
</html>
