<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Sales Assistant</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle at 30% 30%, #6a00ff33, #000 60%);
  color: white;
}

/* NAVBAR */
nav {
  display: flex;
  justify-content: space-between;
  padding: 20px 60px;
  border-bottom: 1px solid #222;
}

nav .links span {
  margin: 0 15px;
  opacity: 0.7;
  cursor: pointer;
}

nav .actions button {
  margin-left: 10px;
}

/* HERO */
.container {
  display: flex;
  justify-content: space-between;
  padding: 80px;
}

.left {
  max-width: 500px;
}

h1 {
  font-size: 60px;
}

.gradient {
  background: linear-gradient(90deg, #a855f7, #6a00ff);
  -webkit-background-clip: text;
  color: transparent;
}

.btn {
  padding: 14px 28px;
  border-radius: 10px;
  border: none;
  margin-top: 20px;
  cursor: pointer;
}

.primary {
  background: linear-gradient(90deg, #a855f7, #6a00ff);
  color: white;
}

.secondary {
  background: transparent;
  border: 1px solid #555;
  color: white;
}

/* CARD */
.card {
  background: #111;
  padding: 30px;
  border-radius: 20px;
  width: 400px;
  box-shadow: 0 0 60px #6a00ff55;
}

/* CHAT */
.chat {
  position: fixed;
  right: 30px;
  bottom: 30px;
  width: 300px;
  background: #111;
  border-radius: 20px;
  padding: 15px;
}

.chat button {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  background: #1a1a1a;
  border: 1px solid #333;
  color: white;
  border-radius: 10px;
}
</style>
</head>

<body>

<nav>
  <div>🤖 AI Sales Assistant</div>
  <div class="links">
    <span>Home</span>
    <span>Features</span>
    <span>Pricing</span>
  </div>
  <div class="actions">
    <button class="secondary">Log in</button>
    <button class="primary">Get Started</button>
  </div>
</nav>

<div class="container">
  <div class="left">
    <h1>Close More Deals <span class="gradient">with AI</span></h1>
    <p>AI that captures leads, sends payments and books clients automatically.</p>

    <button class="btn primary">Get Started Free</button>
    <button class="btn secondary">Watch Demo</button>
  </div>

  <div class="card">
    <h3>Live Overview</h3>
    <canvas id="chart"></canvas>
  </div>
</div>

<div class="chat">
  <div>Hi! I'm your AI assistant</div>

  <button>Book appointment</button>
  <button>Get Pricing</button>
  <button>How it Works</button>
  <button>Talk to Sales</button>
</div>

<script>
new Chart(document.getElementById("chart"), {
  type: "line",
  data: {
    labels: ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
    datasets: [{
      label: "Leads",
      data: [50,120,160,180,210,150,240],
      borderColor: "#a855f7",
      tension: 0.4
    }]
  }
});
</script>

</body>
</html>
