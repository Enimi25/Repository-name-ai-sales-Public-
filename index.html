<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Sales Assistant</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#0b0b0f;color:#fff}

.container{width:min(1120px,92%);margin:0 auto}

header{
  padding:24px 0;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{font-size:22px;font-weight:800}

.nav-links{display:flex;gap:20px;color:#aaa}

.btn{
  padding:12px 20px;
  border-radius:12px;
  border:none;
  cursor:pointer;
}

.btn-primary{
  background:#fff;
  color:#000;
}

.hero{
  padding:80px 0;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.1fr 0.9fr;
  gap:40px;
  align-items:center;
}

h1{
  font-size:60px;
  margin-bottom:20px;
}

.hero p{
  color:#bbb;
  margin-bottom:20px;
}

.demo-card{
  background:#14141d;
  border-radius:24px;
  padding:20px;
}

/* GRAPH */
.graph{
  width:100%;
  height:220px;
}

</style>
</head>

<body>

<header>
<div class="container nav">
<div class="logo">AI Sales Assistant</div>
<div class="nav-links">
<span>Функции</span>
<span>Как работает</span>
<span>Цена</span>
</div>
<button class="btn btn-primary">Запустить</button>
</div>
</header>

<section class="hero">
<div class="container hero-grid">

<div>
<h1>Превращай посетителей сайта в клиентов</h1>
<p>AI бот, который отвечает, продаёт и записывает на демо автоматически</p>
<button class="btn btn-primary">Получить бота</button>
</div>

<div class="demo-card">

<h3 style="margin-bottom:20px;">Live Overview</h3>

<div style="display:flex;gap:20px;margin-bottom:20px;">
<div>Leads: <strong>247</strong></div>
<div>Deals: <strong>39</strong></div>
</div>

<svg class="graph" viewBox="0 0 400 220">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#7c3aed"/>
<stop offset="100%" stop-color="#a855f7"/>
</linearGradient>
</defs>

<polyline fill="none" stroke="url(#g)" stroke-width="3"
points="0,180 50,150 100,140 150,120 200,110 250,130 300,90 350,60 400,40"/>

</svg>

</div>

</div>
</section>

</body>
</html>
