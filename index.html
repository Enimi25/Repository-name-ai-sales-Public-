<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Sales</title>

<style>
body {
    margin: 0;
    font-family: Inter, Arial;
    background: radial-gradient(circle at top, #1a1a1a, #000);
    color: white;
}

.container {
    display: flex;
    justify-content: space-between;
    padding: 100px;
}

.left {
    max-width: 600px;
}

h1 {
    font-size: 64px;
    line-height: 1.1;
}

.gradient {
    background: linear-gradient(90deg, #a855f7, #6366f1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

p {
    color: #aaa;
    font-size: 18px;
}

.buttons {
    margin-top: 30px;
}

.btn {
    padding: 14px 28px;
    border-radius: 10px;
    border: none;
    margin-right: 10px;
    cursor: pointer;
}

.primary {
    background: linear-gradient(90deg, #a855f7, #6366f1);
    color: white;
}

.secondary {
    background: transparent;
    border: 1px solid #444;
    color: white;
}

.card {
    background: rgba(255,255,255,0.05);
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
}

/* CHAT */
#chat {
    position: fixed;
    right: 30px;
    bottom: 30px;
    width: 320px;
    height: 420px;
    background: #111;
    border-radius: 15px;
    display: flex;
    flex-direction: column;
}

#messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
}

#input {
    border: none;
    padding: 10px;
    background: #222;
    color: white;
}
</style>

</head>

<body>

<div class="container">

    <div class="left">
        <h1>
            Close More Deals <br>
            <span class="gradient">with AI</span>
        </h1>

        <p>
            AI that captures leads, sends payment links and books clients automatically.
        </p>

        <div class="buttons">
            <button class="btn primary">Get Started</button>
            <button class="btn secondary">Watch Demo</button>
        </div>
    </div>

    <div class="card">
        <h3>Live Stats</h3>
        <p>Leads: 247</p>
        <p>Revenue: $12,450</p>
    </div>

</div>

<div id="chat">
    <div id="messages">Hi! I can help you buy or book.</div>
    <input id="input" placeholder="Type...">
</div>

</body>
</html>
