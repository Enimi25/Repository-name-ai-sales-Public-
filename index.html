<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Sales</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #000;
    color: white;
    overflow-x: hidden;
}

/* GLOW BACKGROUND */
.bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 20% 20%, #6d28d9, transparent 40%),
                radial-gradient(circle at 80% 80%, #9333ea, transparent 40%);
    filter: blur(120px);
    z-index: -1;
}

/* CONTAINER */
.container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 120px 80px;
}

/* LEFT */
.left {
    max-width: 600px;
}

h1 {
    font-size: 72px;
    line-height: 1.1;
    margin-bottom: 20px;
}

.gradient {
    background: linear-gradient(90deg, #a855f7, #6366f1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

p {
    color: #aaa;
    font-size: 20px;
    margin-bottom: 30px;
}

/* BUTTONS */
.buttons {
    display: flex;
    gap: 15px;
}

.btn {
    padding: 16px 32px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.primary {
    background: linear-gradient(90deg, #a855f7, #6366f1);
}

.primary:hover {
    transform: scale(1.05);
}

.secondary {
    background: transparent;
    border: 1px solid #333;
    color: white;
}

/* RIGHT CARD */
.card {
    background: rgba(255,255,255,0.05);
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 40px rgba(168,85,247,0.3);
}

/* CHAT FLOAT */
#chat-button {
    position: fixed;
    right: 30px;
    bottom: 30px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(90deg, #a855f7, #6366f1);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

/* CHAT WINDOW */
#chat {
    position: fixed;
    right: 30px;
    bottom: 100px;
    width: 320px;
    height: 420px;
    background: #111;
    border-radius: 20px;
    display: none;
    flex-direction: column;
    overflow: hidden;
}

#messages {
    flex: 1;
    padding: 15px;
}

#input {
    border: none;
    padding: 15px;
    background: #222;
    color: white;
}
</style>

</head>

<body>

<div class="bg"></div>

<div class="container">

    <div class="left">
        <h1>
            Close More Deals <br>
            <span class="gradient">with AI</span>
        </h1>

        <p>
            AI that captures leads, sends payments and books clients automatically.
        </p>

        <div class="buttons">
            <button class="btn primary">Get Started</button>
            <button class="btn secondary">Watch Demo</button>
        </div>
    </div>

    <div class="card">
        <h3>Live Stats</h3>
        <p>Leads: 247</p>
        <p>Revenue: $12,450</p>
    </div>

</div>

<!-- CHAT -->
<div id="chat-button" onclick="toggleChat()">💬</div>

<div id="chat">
    <div id="messages">Hi! I can help you buy or book.</div>
    <input id="input" placeholder="Type...">
</div>

<script>
function toggleChat() {
    const chat = document.getElementById("chat");
    chat.style.display = chat.style.display === "flex" ? "none" : "flex";
}
</script>

</body>
</html>
