<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Sales Assistant</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family: 'Inter', sans-serif;
  background:#030306;
  color:white;
  overflow-x:hidden;
}

/* glow */
body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:
    radial-gradient(circle at 20% 30%, #6d28d9, transparent 40%),
    radial-gradient(circle at 80% 80%, #9333ea, transparent 40%);
  filter: blur(120px);
  z-index:-1;
}

/* nav */
nav {
  display:flex;
  justify-content:space-between;
  padding:30px 60px;
}

nav h2 {
  font-weight:800;
}

/* hero */
.hero {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:100px 80px;
}

.left {
  max-width:600px;
}

h1 {
  font-size:70px;
  line-height:1.1;
}

.gradient {
  background: linear-gradient(90deg,#a855f7,#6366f1);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

p {
  color:#aaa;
  font-size:20px;
}

/* buttons */
.buttons {
  margin-top:30px;
}

.btn {
  padding:16px 30px;
  border-radius:12px;
  border:none;
  margin-right:10px;
  cursor:pointer;
}

.primary {
  background:linear-gradient(90deg,#a855f7,#6366f1);
  color:white;
}

.secondary {
  background:transparent;
  border:1px solid #333;
  color:white;
}

/* card */
.card {
  background: rgba(255,255,255,0.05);
  padding:30px;
  border-radius:20px;
  backdrop-filter: blur(20px);
  box-shadow:0 0 40px rgba(168,85,247,0.25);
  width:400px;
}

/* graph */
.graph {
  height:150px;
  border-radius:10px;
  margin-top:20px;
  background:linear-gradient(to top, #6d28d9, transparent);
}
</style>
</head>

<body>

<nav>
  <h2>AI Sales Assistant</h2>
</nav>

<div class="hero">

  <div class="left">
    <h1>
      Close More Deals <br>
      <span class="gradient">with AI</span>
    </h1>

    <p>
      AI that captures leads, sends payments and books clients automatically.
    </p>

    <div class="buttons">
      <button class="btn primary">Get Started</button>
      <button class="btn secondary">Watch Demo</button>
    </div>
  </div>

  <div class="card">
    <h3>Live Dashboard</h3>
    <p>Leads: 247</p>
    <p>Revenue: $12,450</p>
    <div class="graph"></div>
  </div>

</div>

</body>
</html>
