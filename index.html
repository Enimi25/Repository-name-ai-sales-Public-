<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Sales Assistant</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family: Inter, Arial;
  background:#030306;
  color:white;
  overflow-x:hidden;
}

/* glow */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 70% 30%, rgba(124,58,237,.6), transparent 30%),
    radial-gradient(circle at 20% 80%, rgba(88,28,135,.3), transparent 40%);
  filter:blur(40px);
  z-index:-1;
}

/* nav */
nav{
  display:flex;
  justify-content:space-between;
  padding:20px 60px;
}
nav span{
  margin:0 15px;
  opacity:.7;
}
nav button{
  padding:10px 20px;
  border-radius:8px;
  border:none;
}
.login{background:#111;color:white}
.get{background:linear-gradient(90deg,#a855f7,#6366f1)}

/* hero */
.hero{
  display:flex;
  justify-content:space-between;
  padding:80px;
}
.left{max-width:500px}
h1{font-size:70px;margin:0}
.gradient{
  background:linear-gradient(90deg,#a855f7,#6366f1);
  -webkit-background-clip:text;
  color:transparent;
}

.btn{
  padding:14px 25px;
  border-radius:10px;
  border:none;
  margin-top:20px;
}
.primary{background:linear-gradient(90deg,#a855f7,#6366f1)}
.secondary{background:#111;color:white;border:1px solid #444}

/* dashboard */
.dashboard{
  width:450px;
  background:#0d0f18;
  padding:20px;
  border-radius:20px;
  box-shadow:0 0 50px #6a00ff55;
}
.stat{
  background:#111;
  padding:15px;
  border-radius:10px;
  margin:5px;
}

/* chat widget */
.chat-toggle{
  position:fixed;
  right:30px;
  bottom:30px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:linear-gradient(90deg,#a855f7,#6366f1);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.chat-box{
  position:fixed;
  right:30px;
  bottom:100px;
  width:300px;
  background:#111;
  border-radius:20px;
  padding:15px;
  display:none;
}

#messages{
  height:200px;
  overflow:auto;
  font-size:14px;
}

.chat-box input{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:#000;
  border:1px solid #333;
  color:white;
}

.quick button{
  width:100%;
  margin-top:5px;
  padding:10px;
  background:#1a1a1a;
  border:1px solid #333;
  color:white;
  border-radius:10px;
}
</style>
</head>

<body>

<nav>
  <div>🤖 AI Sales Assistant</div>
  <div>
    <span>Home</span>
    <span>Features</span>
    <span>Pricing</span>
  </div>
  <div>
    <button class="login">Log in</button>
    <button class="get">Get Started</button>
  </div>
</nav>

<div class="hero">

<div class="left">
  <h1>Close More Deals <br><span class="gradient">with AI</span></h1>
  <p>AI that captures leads, sends payments and books clients automatically.</p>

  <button class="btn primary">Get Started</button>
  <button class="btn secondary">Watch Demo</button>
</div>

<div class="dashboard">
  <h3>Live Overview</h3>

  <div class="stat">Leads: 247</div>
  <div class="stat">Deals: 39</div>
  <div class="stat">Revenue: $12,450</div>

  <canvas id="chart"></canvas>
</div>

</div>

<!-- CHAT -->
<div class="chat-toggle" onclick="toggleChat()">💬</div>

<div class="chat-box" id="chat">
  <div id="messages"></div>

  <div class="quick">
    <button onclick="sendQuick('book appointment')">Book appointment</button>
    <button onclick="sendQuick('price')">Price list</button>
    <button onclick="sendQuick('how it works')">How it works</button>
  </div>

  <input id="input" placeholder="Type..." onkeydown="if(event.key==='Enter') send()">
</div>

<script>
function toggleChat(){
  const chat=document.getElementById("chat")
  chat.style.display = chat.style.display==="block"?"none":"block"
}

function add(text,cls){
  const div=document.createElement("div")
  div.innerText=text
  document.getElementById("messages").appendChild(div)
}

async function send(){
  const input=document.getElementById("input")
  const text=input.value
  input.value=""
  add("You: "+text)

  const res=await fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text})
  })

  const data=await res.json()
  add("Bot: "+data.reply)
}

function sendQuick(text){
  document.getElementById("input").value=text
  send()
}

/* chart */
new Chart(document.getElementById("chart"), {
  type:"line",
  data:{
    labels:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
    datasets:[{
      label:"Leads",
      data:[50,120,160,180,210,150,240],
      borderColor:"#a855f7",
      tension:0.4
    }]
  }
})
</script>

</body>
</html>
